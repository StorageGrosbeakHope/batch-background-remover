[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "batch-background-remover"
version = "0.4.2"
description = "Plugin-host batch background remover for Windows desktops. Drop a folder of images, pick an extension, get alpha cutouts."
readme = "docs/ARCHITECTURE.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "batch-background-remover contributors" }]
keywords = ["background-removal", "matting", "batch", "segmentation", "plugin-host", "windows"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]

dependencies = [
    "numpy>=1.26,<3",
    "Pillow>=10.2",
    "opencv-python-headless>=4.9",
    "onnxruntime>=1.17; platform_system == 'Windows'",
    "pydantic>=2.6",
    "rich>=13.7",
    "typer>=0.12",
    "watchdog>=4.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
gpu = ["onnxruntime-gpu>=1.17"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4", "mypy>=1.9", "black>=24.3"]

[project.scripts]
bbr = "bbr.cli:app"

[project.entry-points."bbr.plugins"]
# Built-in extensions register here. Third-party wheels can add their own group.
rembg_onnx = "bbr.extensions.rembg_onnx:RemBgOnnxExtension"
grabcut = "bbr.extensions.grabcut:GrabCutExtension"
chroma_key = "bbr.extensions.chroma_key:ChromaKeyExtension"
edge_refine = "bbr.extensions.edge_refine:EdgeRefineExtension"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"